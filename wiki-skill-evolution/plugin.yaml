name: wiki-skill-evolution
version: "1.0.0"
description: >
  Implements an autonomous WikiSkill evolution loop (Raw → Wiki → Skill) as a plugin.
  Detects errors, accumulates knowledge, improves skills, manages gating and rollback, and tracks execution metrics.
author: masato
provides_tools:
  - run_wiki_skill_evolution
provides_hooks:
  - post_tool_call
  - on_session_end